name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      id-token: write # Required by hetznercloud/tps-action

    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: v1.11.7 # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_wrapper: false

      - uses: hashicorp/setup-nomad@6e88df50dd00f3737f04fddde2bf2bd446e313dd # main
        id: setup
        with:
          version: 2.0.4 # renovate: datasource=github-releases depName=hashicorp/nomad

      - name: setup consul binary
        run: |
          curl -o consul.zip "https://releases.hashicorp.com/consul/${{ env.CONSUL_VERSION }}/consul_${{ env.CONSUL_VERSION }}_linux_amd64.zip"
          unzip consul.zip
          mv consul /usr/local/bin/
        env:
          CONSUL_VERSION: 2.0.3 # renovate: datasource=github-releases depName=hashicorp/consul extractVersion=v(?<version>.+)

      - uses: hetznercloud/tps-action@5bfcef547f41c44aa626d0474c0491a1dbda792a # main

      - name: Swap module source
        run: sed -i -e 's|source = ".*"|source = "./.."|' main.tf

      - name: Setup environment
        run: make up

      - name: Verify nodes ready
        run: |
          source files/env.sh
          for status in `nomad node status -json | jq -r .[].Status`; do if [ "$status" != "ready" ]; then false; fi; done;

      - name: Cleanup
        if: always()
        run: make down
