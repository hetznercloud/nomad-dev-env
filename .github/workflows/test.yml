name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    permissions:
      id-token: write # Required by hetznercloud/tps-action

    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2
        with:
          tofu_version: v1.11.7 # renovate: datasource=github-releases depName=opentofu/opentofu
          tofu_wrapper: false

      - uses: hashicorp/setup-nomad@daef63d2965093b49089f7ad2ce4d97475817b3d # main
        id: setup
        with:
          version: 2.0.1 # renovate: datasource=github-releases depName=hashicorp/nomad

      - name: setup consul binary
        run: |
          curl -o consul.zip "https://releases.hashicorp.com/consul/${{ env.CONSUL_VERSION }}/consul_${{ env.CONSUL_VERSION }}_linux_amd64.zip"
          unzip consul.zip
          mv consul /usr/local/bin/
        env:
          CONSUL_VERSION: 1.22.7 # renovate: datasource=github-releases depName=hashicorp/consul extractVersion=v(?<version>.+)

      - uses: hetznercloud/tps-action@dc6d67c5768ca43b840429b6c7409cda61cf4092 # main

      - name: Swap module source
        run: sed -i -e 's|source = ".*"|source = "./.."|' main.tf

      - name: Setup environment
        run: make up

      - name: Verify nodes ready
        run: |
          source files/env.sh
          for status in `nomad node status -json | jq -r .[].Status`; do if [ "$status" != "ready" ]; then false; fi; done;

      - name: Cleanup
        if: always()
        run: make down
